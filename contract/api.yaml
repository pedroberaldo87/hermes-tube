openapi: 3.1.0
info:
  title: Plugin REST contract (plugin_api + extension server)
  version: 1.0.0
  description: |
    Source of truth for the plugin's HTTP routes. Extension prose: `contract/ext-protocol.md`;
    RPC and events: `contract/rpc.yaml` and `contract/events.md`. Generated TS types: `shared/api-types.ts`.

    General rules
    - **Envelope** on every response: `{"ok": true, "data": …}` or `{"ok": false, "error": {code, message, reason?, details?}}`.
      The schema of each operation's `data` is in `x-data`; the possible codes in `x-errors`.
    - **plugin_api REST (x-transport: rest)** — prefix `/api/plugins/<PLUGIN_ID>`, called by the Desktop with `ctx.rest`.
      Always **HTTP 200**, errors included (the Desktop treats 401/403 as re-authentication and 502/503/504 as backend down;
      an unhandled exception becomes a FastAPI 500 and `internal`). Plain `def` routes, < 2 s (`REST_BUDGET_S`), **no AI** and no
      blocking operation: only database reads/writes, `Refresher.kick_if_due`/`kick_channel` or a short HTTP request
      when the route says so. In the gateway topology the gateway strips `Authorization`, cookies and tokens before the plugin host: routes
      get neither identity nor `ctx` (configuration through `load_config_readonly()` via `Settings`). REST routes **emit no event**.
      Invalid body → `invalid` (no FastAPI 422: read the body as a `dict` and validate it).
    - **The extension's own server (x-transport: ext)** — `http://127.0.0.1:<port>`, preferred port 47615, range
      of 10 (47615–47624). Only the extension's service worker calls it. Auth `Authorization: Bearer <device token>`
      (`deviceToken`) everywhere except `GET /health` and `POST /pair/complete`. Here the HTTP status follows `x-error-codes[*].http`
      (the body is still the envelope). Each route has `x-handler` (pure function in `x-module`, signature in ext-protocol.md)
      and `x-deps` (services that `wiring` injects). Transport errors possible on any route: `x-transport-errors`.
    - `x-module` = implementing file; `x-unit` = owner (contract/owners.yaml). Stubs return the `example`.
    - Time = integer seconds, UTC (`Timestamp`). Ids: channel `UC`+22, video 11 characters, the rest opaque.
    - The contract evolves additively: clients ignore unknown fields.

servers:
  - url: /api/plugins/{plugin_id}
    description: plugin_api in the gateway/plugin host (Desktop via ctx.rest)
    variables:
      plugin_id:
        default: PLUGIN_ID
        description: value from plugin/_id.py (shared/ids.ts)

x-error-codes:
  # domain (ERRORS in plugin/core/types.py). `http` only applies on the extension server; REST answers 200.
  not_found: {http: 404, where: domain, description: Entity does not exist (NotFound).}
  conflict: {http: 409, where: domain, description: 'The state does not allow it (invalid transition, default tab, expired item, Extra off).'}
  invalid: {http: 422, where: domain, description: 'Invalid body/parameter (ValidationError); `details.field` when there is one.'}
  unauthorized: {http: 401, where: domain, description: 'Device token missing, wrong, Basic or revoked. On the extension server it comes with `WWW-Authenticate: Bearer`.'}
  undo_refused: {http: 409, where: domain, description: 'Undo refused; `reason` = already_executed | not_undoable | already_undone. Nothing changes.'}
  approval_refused: {http: 403, where: domain, description: 'Unsubscribe approval outside `desktop_rpc`/`ask_choice` (ApprovalRefused).'}
  timeout: {http: 504, where: domain, description: The operation ran out of time (OperationTimeout).}
  busy: {http: 409, where: domain, description: 'Resource busy (AI semaphore full, lock).'}
  llm_unavailable: {http: 503, where: domain, description: 'No model for the `curator` task; the interface says what is missing.'}
  llm_invalid: {http: 502, where: domain, description: AI answer outside the schema even after a retry.}
  youtube_error: {http: 502, where: domain, description: 'YouTube network/parse failure with a readable message.'}
  http_error: {http: 502, where: domain, description: Generic network failure (HttpError).}
  # extension transport
  origin_forbidden: {http: 403, where: ext, description: '`Origin` present and not `chrome-extension://` (a web page). Response without CORS headers.'}
  origin_required: {http: 403, where: ext, description: '`POST /pair/complete` without `Origin` (the service worker always sends it on POST): the origin is pinned at pairing.'}
  origin_mismatch: {http: 403, where: ext, description: 'Token paired by another extension (the pinned origin differs from the `Origin` present).'}
  host_forbidden: {http: 403, where: ext, description: '`Host` other than `127.0.0.1:<port>`/`localhost:<port>` (anti DNS rebinding).'}
  plugin_disabled: {http: 503, where: ext, description: 'Plugin disabled in the profile; the server answers this and shuts down.'}
  no_active_code: {http: 400, where: ext, description: No active pairing code on this server.}
  invalid_code: {http: 400, where: ext, description: 'Wrong code (uses 1 of the 5 attempts).'}
  expired: {http: 400, where: ext, description: 'Expired code (300 s).'}
  used: {http: 400, where: ext, description: 'Code already used (single use).'}
  locked: {http: 400, where: ext, description: '5 wrong attempts; ask the Desktop for a new code.'}
  # general transport
  ext_endpoint_down: {http: 503, where: rest, description: 'The extension server did not start (range busy/error); `POST /pair/start` and `pair.start`.'}
  internal: {http: 500, where: any, description: 'Unhandled exception (bug); short message, no stack.'}

x-transport-errors:
  # can come from any x-transport: ext route (answered by _server.py before the handler)
  unauthorized: routes with deviceToken
  origin_forbidden: all
  origin_mismatch: routes with deviceToken
  host_forbidden: all
  plugin_disabled: all
  internal: all

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: 'Device token (`PairedDevice.token`, 32 urlsafe bytes); the database keeps only the hash.'

  schemas:
    # ------------------------------------------------------------------ envelope and errors
    ErrorCode:
      description: Stable error code (`x-error-codes`).
      type: string
      enum: [not_found, conflict, invalid, unauthorized, undo_refused, approval_refused, timeout, busy,
             llm_unavailable, llm_invalid, youtube_error, http_error, origin_forbidden, origin_required,
             origin_mismatch, host_forbidden, plugin_disabled, no_active_code, invalid_code, expired, used,
             locked, ext_endpoint_down, internal]
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string, description: 'Readable text (backend language); the interface may translate it by `code`.'}
        reason:
          type: string
          description: 'Stable sub-reason. `undo_refused`: already_executed | not_undoable | already_undone.'
        details: {type: object, description: 'Free extra (e.g. `{"field": "rules.include"}`).'}
    OkEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {description: 'See the operation''s `x-data`.'}
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: {const: false}
        error: {$ref: '#/components/schemas/ApiError'}
    AnyEnvelope:
      description: Envelope of any response (`Envelope<T>` in TS).
      oneOf:
        - {$ref: '#/components/schemas/OkEnvelope'}
        - {$ref: '#/components/schemas/ErrorEnvelope'}

    # ------------------------------------------------------------------ common
    IdList:
      type: object
      required: [ids]
      properties:
        ids: {type: array, items: {type: string}, minItems: 1}
    CountResult:
      type: object
      required: [count]
      properties:
        count: {type: integer, minimum: 0}
    Deleted:
      type: object
      required: [id]
      properties:
        id: {type: string}
    KickResult:
      type: object
      required: [result]
      properties:
        result:
          enum: [started, skipped, running]
          description: Return value of `Refresher.kick_if_due` / `kick_channel`.

    # ------------------------------------------------------------------ state
    StatusResponse:
      description: '`GET /status`: `StatusSnapshot` + `ext_port` (extension server port, `null` when down). Contract request: `ext_port` in `StatusSnapshot`.'
      allOf:
        - $ref: '../shared/domain.schema.json#/$defs/StatusSnapshot'
        - type: object
          required: [ext_port]
          properties:
            ext_port: {type: [integer, 'null']}
            channels_total:
              type: integer
              minimum: 0
              description: '`subscribed`+`followed` channels (muted included) = `total` of `GET /channels?relation=subscribed,followed`. Absent = not known yet (never a false 0).'
            subscribed_total:
              type: integer
              minimum: 0
              description: '`subscribed` channels = `total` of `GET /channels?relation=subscribed`. Absent = not known yet.'
            details_pending:
              type: integer
              minimum: 0
              description: 'Recent videos (last 30 days or just arrived) still without a duration or a type (Short/video) that the background lookup is about to fetch — the screen can say "fetching durations" while it is > 0. Stays at 0 while the lookup is backing off (failure or 429). Absent = lookup off or not known yet.'
            ext_last_sync_at:
              type: [integer, 'null']
              description: 'UTC seconds of the last subscription read the extension delivered (`POST /ext/sync/subscriptions` accepted with `signal` complete, or partial with at least one channel). Moves forward even when the read brings no new channel (re-pairing), so the welcome dialog can tell the read finished. `null` = no read yet; absent = not known yet (older backend).'
    StateResponse:
      type: object
      required: [counts, videos]
      properties:
        counts: {$ref: '../shared/domain.schema.json#/$defs/NewCounts'}
        videos:
          type: object
          description: 'video_id → state, only for requested `ids` that have a row (absent = `new` with no reaction).'
          additionalProperties: {$ref: '../shared/domain.schema.json#/$defs/VideoStateRow'}
    VideoStateChange:
      description: 'Changes the state and/or the reaction. At least one of `state`/`reaction`. `reaction: null` clears 👍/👎; `down` becomes a negative example for the next theme curation.'
      type: object
      required: [video_ids]
      properties:
        video_ids: {type: array, items: {type: string, pattern: '^[A-Za-z0-9_-]{11}$'}, minItems: 1, maxItems: 500}
        state: {$ref: '../shared/domain.schema.json#/$defs/VideoState'}
        reaction:
          anyOf:
            - $ref: '../shared/domain.schema.json#/$defs/Reaction'
            - type: 'null'
    ChangedResult:
      type: object
      required: [changed]
      properties:
        changed: {type: integer, minimum: 0}
    ReadResult:
      description: '`POST /read`: `ChangedResult` + ids of the entries written to the history (with `?change_ids=true`).'
      allOf:
        - $ref: '#/components/schemas/ChangedResult'
        - type: object
          properties:
            change_ids:
              type: array
              items: {type: integer, minimum: 1}
              description: 'Only with `?change_ids=true`: the `mark_read` entries written (exact undo: `POST /changes/{id}/undo`); empty when nothing changed.'
    FeedPreviewRequest:
      type: object
      required: [rules]
      properties:
        rules: {$ref: '../shared/domain.schema.json#/$defs/TabRulesInput'}
        limit: {type: integer, minimum: 1, maximum: 100, default: 30}
        cursor: {type: [string, 'null']}
        sort: {type: string, enum: [newest, oldest, longest, shortest, views], default: newest, description: 'As in `GET /feed`.'}
        group: {type: string, enum: [none, channel, folder, day, kind], default: none, description: 'As in `GET /feed`.'}
        tz_offset_min: {type: integer, minimum: -840, maximum: 840, default: 0, description: 'As in `GET /feed` (only for `group=day`).'}

    # ------------------------------------------------------------------ channels
    ChannelRow:
      description: Row of the Manage screen and of the panel.
      type: object
      required: [channel, new_count, watched_90d]
      properties:
        channel: {$ref: '../shared/domain.schema.json#/$defs/Channel'}
        new_count: {type: integer, minimum: 0, description: 'New videos (watermark) of the channel.'}
        watched_90d:
          type: [integer, 'null']
          description: 'Watched in 90 days (`watch_history`); `null` if no device has sent history yet.'
    ChannelPatchBody:
      description: 'Absent fields do not change; `null` clears where accepted. `relation` only followed|ignored (the extension subscribes; `ex` only through the queue). Writes history.'
      type: object
      minProperties: 1
      properties:
        folder_id: {type: [string, 'null']}
        favorite: {type: boolean}
        muted: {type: boolean}
        ai_note: {type: [string, 'null']}
        title: {type: string, minLength: 1}
        tag_ids: {type: array, items: {type: string}}
        relation: {enum: [followed, ignored]}
    ChannelBatchBody:
      description: '`op` = BatchOp or `unsubscribe`. `unsubscribe` **only** creates cleanup candidates (`Cleanup.propose`, manual group): never a queue item.'
      type: object
      required: [op, channel_ids]
      properties:
        op:
          anyOf:
            - $ref: '../shared/domain.schema.json#/$defs/BatchOp'
            - const: unsubscribe
        channel_ids: {type: array, items: {type: string}, minItems: 1}
        value: {type: [string, 'null'], description: 'folder_id (move; null = no folder) or tag_id (tag/untag).'}
        reason: {type: [string, 'null'], description: 'The user''s reason (unsubscribe only).'}
    ChannelBatchResult:
      type: object
      required: [batch, proposed]
      properties:
        batch:
          anyOf:
            - $ref: '../shared/domain.schema.json#/$defs/BatchResult'
            - type: 'null'
        proposed:
          type: array
          items: {$ref: '../shared/domain.schema.json#/$defs/CleanupCandidate'}
    ChannelAddBody:
      type: object
      required: [url_or_handle]
      properties:
        url_or_handle: {type: string, minLength: 2, description: 'Channel/video link, @handle or UC… id.'}
        folder_id: {type: [string, 'null']}

    # ------------------------------------------------------------------ folders, tags, tabs
    FolderCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        parent_id: {type: [string, 'null']}
        color: {type: [string, 'null']}
    FolderPatch:
      description: '`parent_id` present = move (cycle → invalid).'
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1}
        color: {type: [string, 'null']}
        parent_id: {type: [string, 'null']}
    TagCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        color: {type: [string, 'null']}
    TagPatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1}
        color: {type: [string, 'null']}
    TabCreate:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1}
        kind: {$ref: '../shared/domain.schema.json#/$defs/TabKind'}
        rules: {$ref: '../shared/domain.schema.json#/$defs/TabRulesInput'}
        icon: {type: [string, 'null']}
        filters: {type: object, description: 'Interface view state (the engine ignores it).'}
    TabPatchBody:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1}
        kind: {$ref: '../shared/domain.schema.json#/$defs/TabKind'}
        rules: {$ref: '../shared/domain.schema.json#/$defs/TabRulesInput'}
        icon: {type: [string, 'null']}
        filters: {type: object}
    TabFromChannels:
      type: object
      required: [name, channel_ids]
      properties:
        name: {type: string, minLength: 1}
        channel_ids: {type: array, items: {type: string}, minItems: 1}
        icon: {type: [string, 'null']}

    # ------------------------------------------------------------------ pairing
    PairStartResponse:
      description: '6-digit code (300 s, single use, 5 attempts; a new code invalidates the previous one) + port of the extension server, already on.'
      allOf:
        - $ref: '../shared/domain.schema.json#/$defs/PairingCode'
        - type: object
          required: [port]
          properties:
            port: {type: integer, minimum: 1024, maximum: 65535}

    # ------------------------------------------------------------------ extension setup
    ExtensionSetupPlatform:
      description: Operating system of the computer where Hermes runs (where the folder is created and the browser is opened).
      type: string
      enum: [macos, linux, windows, other]
    ExtensionBrowserKey:
      description: The closed list of Chromium browsers the setup knows (`arc` only on macOS). The only thing a caller may choose.
      type: string
      enum: [chrome, edge, brave, chromium, vivaldi, opera, arc]
    ExtensionBrowser:
      description: |
        A Chromium browser found on the computer where Hermes runs. `extensions_url` is its own Extensions page
        (`edge://extensions/`…). `sandbox`: `snap` or `flatpak` (Linux) when the browser runs confined, else `null`;
        `app_id` is then the snap name or the Flatpak id. `folder_visible` is `false` when that sandbox cannot read the
        extension folder (a Flatpak without access to the home folder, a snap with a home folder outside `/home`): the
        screen then says how to give it access.
      type: object
      required: [key, name, extensions_url, sandbox, app_id, folder_visible]
      properties:
        key: {$ref: '#/components/schemas/ExtensionBrowserKey'}
        name: {type: string}
        extensions_url: {type: string}
        sandbox:
          anyOf:
            - {type: string, enum: [snap, flatpak]}
            - type: 'null'
        app_id: {type: [string, 'null']}
        folder_visible: {type: boolean}
    ExtensionSetupStatus:
      description: |
        What the "Set up the extension" button offers. `path` is the fixed folder in the home folder of the computer
        where Hermes runs, written as on that system (backslashes on Windows). `state`: `not_installed` (no folder) ·
        `installed` (our folder, up to date) · `update_available` (the bundled build is newer, or a file of ours is
        missing) · `not_ours` (a folder or file with that name exists without our marker: Hermes will not touch it) ·
        `unavailable` (this copy of the plugin ships no built extension). `browsers`: the Chromium browsers found there,
        in the order offered (first = default); empty when none was found.
      type: object
      required: [state, path, bundled_version, installed_version, platform, browsers]
      properties:
        state: {type: string, enum: [not_installed, installed, update_available, not_ours, unavailable]}
        path: {type: string}
        bundled_version: {type: [string, 'null']}
        installed_version: {type: [string, 'null'], description: 'Version in our marker; `null` without our folder.'}
        platform: {$ref: '#/components/schemas/ExtensionSetupPlatform'}
        browsers:
          type: array
          items: {$ref: '#/components/schemas/ExtensionBrowser'}
        wsl:
          description: 'Only when Hermes runs inside WSL (then `platform` is `windows` and `path` is a Windows path); absent or `null` otherwise. `interop`: Hermes can start Windows programs; `windows_folder`: the folder is in the Windows user folder (else on the WSL disk).'
          anyOf:
            - {$ref: '#/components/schemas/ExtensionSetupWsl'}
            - type: 'null'
    ExtensionSetupWsl:
      description: Hermes inside WSL on Windows. `distro` is the WSL distribution name when known.
      type: object
      required: [distro, interop, windows_folder]
      properties:
        distro: {type: [string, 'null']}
        interop: {type: boolean}
        windows_folder: {type: boolean}
    ExtensionSetupRequest:
      description: 'Optional. At most one field, `browser`: a key of the closed list (never a path or a command). Any other field or value is refused with `invalid`.'
      type: object
      additionalProperties: false
      properties:
        browser:
          anyOf:
            - $ref: '#/components/schemas/ExtensionBrowserKey'
            - type: 'null'
    ExtensionSetupResult:
      description: |
        After the click. `action`: `installed` (folder created) · `updated` (our files rewritten in place: press "reload"
        on the extension's card in the browser) · `unchanged` (already up to date: only the pages were opened again).
        `opened` says what Hermes managed to open on its own computer; `open_problem` explains a page that did not open:
        `no_browser` (the chosen browser, or any Chromium browser, was not found) · `no_display` (no screen, e.g. a
        server) · `failed` · `unsupported` (an operating system Hermes cannot open things on) · `disabled` (test mode).
        `browser`: the browser used (or that would have been used); `null` when none.
      type: object
      required: [state, action, path, version, opened, open_problem, platform, browser]
      properties:
        state: {type: string, enum: [installed]}
        action: {type: string, enum: [installed, updated, unchanged]}
        path: {type: string}
        version: {type: string}
        opened:
          type: object
          required: [extensions_page, folder]
          properties:
            extensions_page: {type: boolean}
            folder: {type: boolean}
        open_problem:
          anyOf:
            - $ref: '#/components/schemas/ExtensionSetupOpenProblem'
            - type: 'null'
        platform: {$ref: '#/components/schemas/ExtensionSetupPlatform'}
        browser:
          anyOf:
            - $ref: '#/components/schemas/ExtensionBrowser'
            - type: 'null'
        wsl:
          description: 'Only when Hermes runs inside WSL (then `platform` is `windows` and `path` is a Windows path); absent or `null` otherwise. `interop`: Hermes can start Windows programs; `windows_folder`: the folder is in the Windows user folder (else on the WSL disk).'
          anyOf:
            - {$ref: '#/components/schemas/ExtensionSetupWsl'}
            - type: 'null'
    ExtensionSetupOpenProblem:
      description: Why the browser's Extensions page did not open on the computer where Hermes runs.
      type: string
      enum: [no_browser, no_display, failed, unsupported, disabled]

    # ------------------------------------------------------------------ data
    ImportBody:
      description: 'Exactly one: `data` (JSON already read) or `path` (file on the **backend**, chosen through `ctx.os.pickOpenPath`).'
      type: object
      minProperties: 1
      maxProperties: 1
      properties:
        data: {type: object}
        path: {type: string, minLength: 1}
    ExportData:
      description: 'Output of `DataOps.export_json`: channels, folders, tags, tabs, themes, video state. Never contains `EXPORT_EXCLUDED_TABLES`.'
      type: object
      required: [schema_version]
      properties:
        schema_version: {type: integer}
      additionalProperties: true

    # ------------------------------------------------------------------ cleanup
    CleanupView:
      type: object
      required: [scan, channels]
      properties:
        scan:
          anyOf:
            - $ref: '../shared/domain.schema.json#/$defs/CleanupScan'
            - type: 'null'
        channels:
          type: object
          description: 'channel_id → channel, for each candidate.'
          additionalProperties: {$ref: '../shared/domain.schema.json#/$defs/Channel'}
    QueueView:
      description: 'A `done` item''s `error` carries the note `not_subscribed` / `already_subscribed` (nothing was clicked), else `null`.'
      type: object
      required: [items, pending]
      properties:
        items:
          type: array
          items: {$ref: '../shared/domain.schema.json#/$defs/QueueItem'}
        pending: {type: integer, minimum: 0, description: 'Items approved + running.'}

    # ------------------------------------------------------------------ Extras
    ExtrasPatch:
      type: object
      minProperties: 1
      properties:
        honest_thumbnails: {type: boolean}
        hn_lens: {type: boolean}
        hn_channels: {type: boolean}
        import_lists: {type: boolean}
    HnDownloadResult:
      type: object
      required: [status]
      properties:
        status:
          enum: [started, running, ready]
          description: 'Downloads and indexes the dataset in a thread (like `kick_if_due`); follow it in `GET /extras` (`hn_dataset_ready`).'
    HnChannel:
      type: object
      required: [channel_id, title, video_count, top_video_ids, why]
      properties:
        channel_id: {type: string}
        title: {type: string}
        video_count: {type: integer, minimum: 1}
        top_video_ids: {type: array, items: {type: string}}
        why: {type: [string, 'null'], description: '"Why HN likes it" (summary from the dataset).'}

    # ------------------------------------------------------------------ extension
    HealthResponse:
      type: object
      required: [service, instance, pairing_open]
      properties:
        service: {type: string, description: 'Equal to PLUGIN_ID; the extension discards ports with any other value.'}
        instance: {type: string, description: 'Random id of the server instance (checks the owner stored in meta).'}
        pairing_open: {type: boolean, description: 'There is an active pairing code here: the extension only tries the code where this is true.'}
        proof:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 'Server proof (additive): only with `?device=&nonce=` and a live (not revoked) device; otherwise absent. `HMAC-SHA256(key = hex sha256(token), "hermestube-server-v1|" + nonce + "|" + port)`, lowercase hex. The extension sends its token only to a port that proved it.'
    PairCompleteBody:
      type: object
      required: [code, name]
      properties:
        code: {type: string, pattern: '^[0-9]{6}$'}
        name: {type: string, minLength: 1, maxLength: 80, description: 'Device name (e.g. "Chrome — Mac").'}
    PairPakeStartBody:
      description: 'PAKE round 1 (additive; the code never travels): the client''s SPAKE2 element. Spends one attempt of the code, as a wrong code does.'
      type: object
      required: [name, pake]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, description: 'Device name (e.g. "Chrome — Mac").'}
        pake:
          type: object
          required: [x]
          properties:
            x: {type: string, pattern: '^[0-9a-f]{512}$', description: 'Group element, 512 lowercase hex digits (2048 bits, zero-padded).'}
    PairPakeConfirmBody:
      description: 'PAKE round 2 (additive): the client''s key confirmation for the round 1 session.'
      type: object
      required: [name, pake]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, description: 'Device name (e.g. "Chrome — Mac").'}
        pake:
          type: object
          required: [session, confirm]
          properties:
            session: {type: string, minLength: 1, description: '`pake.session` from the round 1 answer (single use, 60 s).'}
            confirm: {type: string, description: '`HMAC-SHA256(session key, "hermestube-pair-v1|client")`, lowercase hex.'}
    PairPakeChallenge:
      description: 'Answer to PAKE round 1 (additive). Only a server that knows the code, on the port the extension dialled, can produce `confirm`.'
      type: object
      required: [pake]
      properties:
        pake:
          type: object
          required: [session, y, confirm, remaining]
          properties:
            session: {type: string, minLength: 1, description: 'Opaque id of the round 2 session (single use, 60 s).'}
            y: {type: string, pattern: '^[0-9a-f]{512}$', description: 'Server group element, 512 lowercase hex digits.'}
            confirm: {type: string, pattern: '^[0-9a-f]{64}$', description: '`HMAC-SHA256(session key, "hermestube-pair-v1|server")`, lowercase hex.'}
            remaining: {type: integer, minimum: 0, description: 'Attempts left if the extension''s code turns out wrong (it cannot tell a typo apart from another program).'}
    SubscriptionBatchBody:
      description: '`SubscriptionBatch`: the **whole** list in one request. Only `complete` marks absent ones as `ex`.'
      type: object
      required: [channels, signal]
      properties:
        channels:
          type: array
          maxItems: 5000
          items: {$ref: '../shared/domain.schema.json#/$defs/ChannelIn'}
        signal: {$ref: '../shared/domain.schema.json#/$defs/SyncSignal'}
    WatchBatchBody:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '../shared/domain.schema.json#/$defs/WatchEvent'}
    ExtQueueView:
      type: object
      required: [items, channels]
      properties:
        items:
          type: array
          description: 'Only `approved` items with `approved_via` (oldest first). The extension runs one at a time.'
          items: {$ref: '../shared/domain.schema.json#/$defs/QueueItem'}
        channels:
          type: object
          description: 'channel_id → channel (url/handle to open the page).'
          additionalProperties: {$ref: '../shared/domain.schema.json#/$defs/Channel'}
    QueueResultBody:
      description: |
        `error` with `done` is a note, not an error: `not_subscribed` / `already_subscribed` (the page was already in
        the target state and nothing was clicked) are kept in the item's `error`; any other text sent with `done` is
        dropped.
      type: object
      required: [status]
      properties:
        status: {enum: [running, done, failed]}
        error: {type: [string, 'null']}
    SearchResultBody:
      description: 'Exactly one: `payload` (the search page''s `ytInitialData`, object or text) or `error`.'
      type: object
      minProperties: 1
      maxProperties: 1
      properties:
        payload: {type: [object, string]}
        error: {type: string}

    # ------------------------------------------------------------------ local playlists
    Playlist:
      description: 'A local playlist: kept only in the plugin database, never written to the YouTube account.'
      type: object
      required: [id, name, count, first_video_id, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, maxLength: 80}
        count: {type: integer, minimum: 0, maximum: 5000}
        first_video_id: {type: [string, 'null'], description: 'First video in play order (the thumbnail); null = empty.'}
        created_at: {$ref: '../shared/domain.schema.json#/$defs/Timestamp'}
        updated_at: {$ref: '../shared/domain.schema.json#/$defs/Timestamp'}
    PlaylistCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, description: 'Trimmed; unique ignoring case and accents.'}
        video_ids:
          type: array
          maxItems: 200
          items: {type: string, minLength: 11, maxLength: 11}
          description: 'Optional first videos (known to the library).'
    PlaylistPatch:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
    PlaylistVideos:
      type: object
      required: [video_ids]
      properties:
        video_ids:
          type: array
          minItems: 1
          maxItems: 200
          items: {type: string, minLength: 11, maxLength: 11}
    PlaylistItemsResult:
      type: object
      required: [playlist, changed]
      properties:
        playlist: {$ref: '#/components/schemas/Playlist'}
        changed: {type: integer, minimum: 0, description: 'Videos added (already there = not counted) or removed.'}

paths:
  # ==================================================================== state and refresh
  /status:
    get:
      operationId: getStatus
      summary: Counters for the chip, panel and mascot; turns on the extension server and starts an overdue RSS run
      description: |
        Calls `Refresher.kick_if_due()` (non-blocking) and `ensure_server` (starts the extension server on
        demand; `ext_endpoint_up` = real health through `/health` + `instance`). Read-only otherwise.
        The Desktop polls every ≤ 5 s while the window is visible; no event is needed.
        `channels_total`/`subscribed_total` (`Refresher.channel_totals`) for the welcome screen and the extension banner
        without `GET /channels`; optional (absent while not known).
      x-module: plugin/api/status.py
      x-unit: area-status
      x-data: {$ref: '#/components/schemas/StatusResponse'}
      x-errors: []
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example:
                ok: true
                data:
                  new_total: 12
                  new_by_tab:
                    - {tab_id: all-new, name: Tudo novo, count: 12, icon: null}
                    - {tab_id: favorites, name: Favoritos, count: 3, icon: '⭐'}
                  fav_new:
                    - {channel_id: UCBJycsmduvYEL83R_U4JriQ, title: Marques Brownlee, count: 1, latest_video_id: dQw4w9WgXcQ, latest_title: The best phone of 2026}
                  ext_endpoint_up: true
                  last_rss_at: 1762700000
                  refresh_running: false
                  queue_pending: 0
                  search_pending: 0
                  devices_online: 1
                  ext_port: 47615
                  rss_down_since: null
                  rss_fallback_channels: 0
                  channels_total: 52
                  subscribed_total: 47
                  details_pending: 0
                  ext_last_sync_at: 1762699950

  /refresh:
    post:
      operationId: postRefresh
      summary: Refresh everything now (RSS)
      description: '`Refresher.kick_if_due(force)`; returns right away. End of the cycle: `last_rss_at` changes in `GET /status`.'
      x-module: plugin/api/refresh.py
      x-unit: area-status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: {type: boolean, default: true, description: 'true skips the `rss_interval_min` grace period.'}
            example: {force: true}
      x-data: {$ref: '#/components/schemas/KickResult'}
      x-errors: [invalid]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: true, data: {result: started}}

  /refresh/{channel_id}:
    post:
      operationId: postRefreshChannel
      summary: Refresh one channel now
      description: '`Refresher.kick_channel(channel_id)` (thread).'
      x-module: plugin/api/refresh.py
      x-unit: area-status
      parameters:
        - {name: channel_id, in: path, required: true, schema: {type: string, pattern: '^UC[A-Za-z0-9_-]{22}$'}, example: UCBJycsmduvYEL83R_U4JriQ}
      x-data: {$ref: '#/components/schemas/KickResult'}
      x-errors: [not_found, invalid]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: true, data: {result: running}}

  /read:
    post:
      operationId: postRead
      summary: Mark as read (channel, recursive folder, tab or everything)
      description: |
        `Refresher.mark_read_changes(ReadScope)`; writes `mark_read` to the history (undoable). With `?change_ids=true`
        it also returns the ids written (`change_ids`) so undo can use the exact id; without the parameter the response is
        the earlier one (`{changed}`). `{kind: tab, id}` marks exactly the channels the tab shows
        (rules resolved on the server by the feed engine, `FeedEngine.tab_channels`); missing tab → `not_found`;
        a theme tab, a themes/lenses-only tab or "Watch later" (`later`/`:later`) → `invalid` with a message.
      x-module: plugin/api/refresh.py
      x-unit: area-status
      parameters:
        - {name: change_ids, in: query, required: false, description: '`true` adds `change_ids` to the response.', schema: {type: boolean, default: false}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../shared/domain.schema.json#/$defs/ReadScope'}
            example: {kind: folder, id: f_tech}
      x-data: {$ref: '#/components/schemas/ReadResult'}
      x-errors: [not_found, invalid]
      responses:
        '200':
          description: Envelope; `data.changed` = channels whose watermark moved forward; `data.change_ids` = history entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: true, data: {changed: 7, change_ids: [42]}}

  # ==================================================================== feed and video state
  /state:
    get:
      operationId: getState
      summary: New counts per tab, folder (recursive) and channel + state of the requested videos
      x-module: plugin/api/state.py
      x-unit: area-feed
      parameters:
        - {name: ids, in: query, required: false, description: 'comma-separated video_ids (≤ 200)', schema: {type: string}, example: 'dQw4w9WgXcQ,9bZkp7q19f0'}
      x-data: {$ref: '#/components/schemas/StateResponse'}
      x-errors: [invalid]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example:
                ok: true
                data:
                  counts:
                    total: 12
                    by_tab: {all-new: 12, favorites: 3}
                    by_folder: {f_tech: 9, '': 3}
                    by_channel: {UCBJycsmduvYEL83R_U4JriQ: 1}
                  videos:
                    dQw4w9WgXcQ: {video_id: dQw4w9WgXcQ, state: later, reaction: up, updated_at: 1762700100}

  /feed:
    get:
      operationId: getFeed
      summary: Paged feed of a tab, folder, channel or "Watch later" (with "why it is here")
      description: |
        Exactly one of `tab`, `folder`, `channel`, `state`. `tab` → `FeedEngine.page`; `folder`/`channel` → `FeedEngine.preview`
        with `include.folders`/`include.channels` (recursive folder). Same tab = same feed in the Desktop, the extension and the agent.
        `state=later` → `FeedEngine.later_page` ("Watch later" as a source: from the last marked to the oldest, no date
        window, `why` = the video's origin — channel folder › channel › theme; its own cursor). `q` searches inside the source (video
        title and channel name, every word, accent- and case-insensitive like `GET /channels?q`), after all the filters;
        it combines with `cursor`, and `counts` only count what matched.
      x-module: plugin/api/feed.py
      x-unit: area-feed
      parameters:
        - {name: tab, in: query, required: false, schema: {type: string}, example: all-new}
        - {name: folder, in: query, required: false, schema: {type: string}}
        - {name: channel, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, description: '"Watch later" as a source (no tab).', schema: {type: string, enum: [later]}}
        - {name: q, in: query, required: false, description: 'Search in the title and the channel name (normalised; up to 200 characters; empty = no search).', schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
        - {name: cursor, in: query, required: false, schema: {type: string}, description: '`next_cursor` of the previous page (opaque; only valid for the same source, mode, `q`, `sort` and `group`).'}
        - {name: sort, in: query, required: false, description: 'Item order (inside the group, if any). `longest`/`shortest`: videos with no known duration go last. `views`: most viewed first; those with no count go last.', schema: {type: string, enum: [newest, oldest, longest, shortest, views], default: newest}}
        - {name: group, in: query, required: false, description: 'Groups — the server only SORTS by the group (a group''s items come together, across pages); the screen draws the header when the key changes. `channel`: by channel (name); `folder`: by the channel''s folder (folder order; no folder last); `day`: by publication day (most recent first; uses `tz_offset_min`); `kind`: videos, then Shorts, then unknown.', schema: {type: string, enum: [none, channel, folder, day, kind], default: none}}
        - {name: tz_offset_min, in: query, required: false, description: 'Minutes to add to UTC to find the local day (e.g. -180 in Brasília); only for `group=day`.', schema: {type: integer, minimum: -840, maximum: 840, default: 0}}
      x-data: {$ref: '../shared/domain.schema.json#/$defs/FeedPage'}
      x-errors: [not_found, invalid]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example:
                ok: true
                data:
                  items:
                    - video: {id: dQw4w9WgXcQ, channel_id: UCBJycsmduvYEL83R_U4JriQ, title: The best phone of 2026, published_at: 1762690000, description: Review completo., channel_title: Marques Brownlee, duration_s: 1260, is_short: false, views: 1200000, first_seen_at: 1762690500, origin: rss}
                      channel: {id: UCBJycsmduvYEL83R_U4JriQ, title: Marques Brownlee, relation: subscribed, source: extension, added_at: 1762000000, handle: '@mkbhd', thumb: 'https://yt3.ggpht.com/x.jpg', url: 'https://www.youtube.com/@mkbhd', folder_id: f_tech, favorite: true, muted: false, unsubscribed_at: null, last_video_at: 1762690000, videos_per_week: 2.5, shorts_ratio: 0.1, ai_note: null, tag_ids: [t_review]}
                      state: new
                      reaction: null
                      is_new: true
                      why: {via: folder, label: Tech, detail: null}
                      badges: []
                  next_cursor: 'c2:1762690000:dQw4w9WgXcQ'
                  counts: {total: 48, new: 12}

  /feed/preview:
    post:
      operationId: postFeedPreview
      summary: Preview of unsaved rules (tab editor)
      x-module: plugin/api/feed.py
      x-unit: area-feed
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedPreviewRequest'}
            example:
              rules:
                include: {folders: [f_tech]}
                exclude: {shorts: true}
                filters: {only_new: false, min_s: 1200}
                mode: long
              limit: 30
      x-data: {$ref: '../shared/domain.schema.json#/$defs/FeedPage'}
      x-errors: [invalid]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: true, data: {items: [], next_cursor: null, counts: {total: 0, new: 0}}}

  /videos:
    get:
      operationId: getVideos
      summary: 'Videos by id (`::tube-video` card in the chat)'
      description: '`FeedItem` of each known id (`why: null`); unknown ids are left out (the card falls back to thumbnail + link).'
      x-module: plugin/api/feed.py
      x-unit: area-feed
      parameters:
        - {name: ids, in: query, required: true, description: 'comma-separated video_ids (≤ 50)', schema: {type: string}, example: dQw4w9WgXcQ}
      x-data:
        type: object
        required: [items]
        properties:
          items:
            type: array
            items: {$ref: '../shared/domain.schema.json#/$defs/FeedItem'}
      x-errors: [invalid]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example:
                ok: true
                data:
                  items:
                    - video: {id: dQw4w9WgXcQ, channel_id: UCBJycsmduvYEL83R_U4JriQ, title: The best phone of 2026, published_at: 1762690000, description: null, channel_title: Marques Brownlee, duration_s: null, is_short: null, views: null, first_seen_at: 1762690500, origin: rss}
                      channel: null
                      state: seen
                      reaction: null
                      is_new: false
                      why: null
                      badges: []

  /videos/state:
    get:
      operationId: getVideosByState
      summary: 'List by state (e.g. "Later")'
      x-module: plugin/api/state.py
      x-unit: area-feed
      parameters:
        - {name: state, in: query, required: true, schema: {$ref: '../shared/domain.schema.json#/$defs/VideoState'}, example: later}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      x-data:
        type: object
        required: [items]
        properties:
          items:
            type: array
            items: {$ref: '../shared/domain.schema.json#/$defs/VideoStateRow'}
      x-errors: [invalid]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: true, data: {items: [{video_id: dQw4w9WgXcQ, state: later, reaction: null, updated_at: 1762700100}]}}
    post:
      operationId: postVideosState
      summary: Seen, later, archive, 👍/👎
      description: '`VideoStateService.set_state` / `set_reaction` (`actor=user`, undoable).'
      x-module: plugin/api/state.py
      x-unit: area-feed
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VideoStateChange'}
            example: {video_ids: [dQw4w9WgXcQ], reaction: down}
      x-data: {$ref: '#/components/schemas/ChangedResult'}
      x-errors: [invalid]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: true, data: {changed: 1}}

  # ==================================================================== channels and history
  /channels:
    get:
      operationId: getChannels
      summary: Channels with filters (Manage, panel, Former subscriptions)
      x-module: plugin/api/channels.py
      x-unit: area-channels
      parameters:
        - {name: relation, in: query, required: false, description: 'Comma-separated relations (empty = all); `ex` = Former subscriptions.', schema: {type: string}, example: 'subscribed,followed'}
        - {name: folder, in: query, required: false, description: 'folder_id; `none` = no folder.', schema: {type: string}}
        - {name: recursive, in: query, required: false, schema: {type: boolean, default: true}}
        - {name: tag, in: query, required: false, schema: {type: string}}
        - {name: favorite, in: query, required: false, schema: {type: boolean}}
        - {name: muted, in: query, required: false, schema: {type: boolean}}
        - {name: source, in: query, required: false, schema: {$ref: '../shared/domain.schema.json#/$defs/ChannelSource'}}
        - {name: q, in: query, required: false, description: 'Search by title/handle (normalised).', schema: {type: string}}
        - {name: ids, in: query, required: false, description: 'Comma-separated channel_ids.', schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 2000}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      x-data:
        type: object
        required: [items, total]
        properties:
          items:
            type: array
            items: {$ref: '#/components/schemas/ChannelRow'}
          total: {type: integer, minimum: 0, description: 'Total with the filter, ignoring limit/offset.'}
      x-errors: [invalid]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example:
                ok: true
                data:
                  items:
                    - channel: {id: UCBJycsmduvYEL83R_U4JriQ, title: Marques Brownlee, relation: subscribed, source: extension, added_at: 1762000000, handle: '@mkbhd', thumb: null, url: 'https://www.youtube.com/@mkbhd', folder_id: f_tech, favorite: true, muted: false, unsubscribed_at: null, last_video_at: 1762690000, videos_per_week: 2.5, shorts_ratio: 0.1, ai_note: Reviews de tecnologia, tag_ids: []}
                      new_count: 1
                      watched_90d: 4
                  total: 1

  /channels/{id}:
    get:
      operationId: getChannel
      summary: One channel
      x-module: plugin/api/channels.py
      x-unit: area-channels
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: UCBJycsmduvYEL83R_U4JriQ}
      x-data: {$ref: '#/components/schemas/ChannelRow'}
      x-errors: [not_found]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: false, error: {code: not_found, message: Canal não encontrado}}
    patch:
      operationId: patchChannel
      summary: Edit a channel (⭐, mute, folder, tags, note, follow/ignore)
      description: '`ChannelService.update` / `set_tags` / `set_relation`, in one transaction; invalid transition → `conflict`.'
      x-module: plugin/api/channels.py
      x-unit: area-channels
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelPatchBody'}
            example: {favorite: true, folder_id: f_tech}
      x-data: {$ref: '../shared/domain.schema.json#/$defs/Channel'}
      x-errors: [not_found, invalid, conflict]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example:
                ok: true
                data: {id: UCBJycsmduvYEL83R_U4JriQ, title: Marques Brownlee, relation: subscribed, source: extension, added_at: 1762000000, handle: '@mkbhd', thumb: null, url: null, folder_id: f_tech, favorite: true, muted: false, unsubscribed_at: null, last_video_at: null, videos_per_week: null, shorts_ratio: null, ai_note: null, tag_ids: []}

  /channels/batch:
    post:
      operationId: postChannelsBatch
      summary: Manage screen batch (atomic; "unsubscribe" only proposes to the cleanup)
      x-module: plugin/api/channels.py
      x-unit: area-channels
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelBatchBody'}
            example: {op: move, channel_ids: [UCBJycsmduvYEL83R_U4JriQ], value: f_tech}
      x-data: {$ref: '#/components/schemas/ChannelBatchResult'}
      x-errors: [not_found, invalid, conflict]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: true, data: {batch: {changed: [UCBJycsmduvYEL83R_U4JriQ], skipped: [], change_id: 41}, proposed: []}}

  /channels/add:
    post:
      operationId: postChannelsAdd
      summary: Follow by link/@handle (without subscribing)
      description: 'Resolves through `YouTubeClient.resolve_channel` (1 short request to YouTube, no retry, to fit in 2 s). Already exists → `conflict` with the existing channel in `details.channel` (the screen shows "already in your list"). After creating it, starts `kick_channel`. Never creates `subscribed`.'
      x-module: plugin/api/channels.py
      x-unit: area-channels
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelAddBody'}
            example: {url_or_handle: '@mkbhd'}
      x-data: {$ref: '../shared/domain.schema.json#/$defs/Channel'}
      x-errors: [invalid, youtube_error, conflict, timeout]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
