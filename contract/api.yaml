  # ==================================================================== AI
  /ai/status:
    get:
      operationId: getAiStatus
      summary: Is an AI model configured? (no network; to warn before the click)
      description: |
        `core.ai.status_of(LLM)`: only reads the Hermes configuration through the adapter (the plugin's task, otherwise the main
        model) — no model call, no network. In the plugin host (no `ctx`) it answers for what the gateway will
        do with the same configuration. `available: true` does not guarantee a valid credential: the `llm_unavailable` of
        `organize.run`/`theme.create` is still the final word. `reason`: `no_model` (nothing configured) ·
        `provider_unavailable` (configured, but Hermes in this process does not call it now, or the provider refused the
        sign-in / said "no provider" less than 60 s ago — the screen opens with "couldn't reach your model"). `provider`/`model`
        = the configured route (the failed one while `provider_unavailable`); `null` = unknown or `auto`.
      x-module: plugin/api/ai.py
      x-unit: area-ai
      x-data: {$ref: '../shared/domain.schema.json#/$defs/AiStatus'}
      x-errors: []
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: true, data: {available: true, model: claude-haiku-5-5, reason: null, provider: anthropic}}

