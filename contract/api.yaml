          description: Envelope; `data` follows x-data (`result` as in the RPC method's `job_result` in rpc.yaml)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: true, data: {id: job_5e2b, kind: theme, status: running, created_at: 1762700000, updated_at: 1762700012, progress: {stage: search, done: 16, total: 16, message: 212 vídeos encontrados, step: {name: search, done: 212, total: 212}}, result: null, error: null}}

