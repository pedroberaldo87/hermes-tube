      x-unit: area-jobs
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: job_5e2b}
      x-data: {$ref: '../shared/domain.schema.json#/$defs/Job'}
      x-errors: [not_found]
      responses:
