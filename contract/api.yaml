  # ==================================================================== extension setup
  /extension/setup:
    get:
      operationId: getExtensionSetup
      summary: Extension folder status and the browsers found (reads only)
      description: |
        Whether the extension shipped inside the plugin is already in the fixed folder of the home folder, needs an
        update, or the folder belongs to somebody else; and which Chromium browsers are installed on the computer where
        Hermes runs (fixed lists of places per system; nothing is run). Reads only: never writes and never opens
        anything.
      x-module: plugin/api/extension.py
      x-unit: area-extension
      x-data: {$ref: '#/components/schemas/ExtensionSetupStatus'}
      x-errors: []
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: true, data: {state: not_installed, path: '/home-folder/HermesTube Extension', bundled_version: 0.1.0, installed_version: null, platform: macos, browsers: [{key: chrome, name: Google Chrome, extensions_url: 'chrome://extensions/', sandbox: null, app_id: null, folder_visible: true}]}}
    post:
      operationId: postExtensionSetup
      summary: Set up (or update) the extension folder and open the browser
      description: |
        Only on a click in the Desktop. Copies the extension shipped in the plugin to `<home>/HermesTube Extension`
        (fixed: no path is read from the body or the query) with a marker file, then opens the chosen browser's own
        Extensions page and shows the folder in the file manager — on the computer where Hermes runs, with fixed argument
        lists, no shell and time limits. The body may name **one** browser from the closed list (`browser`); without it
        the first browser found is used. Any other field, or a value outside the list, is refused (`invalid`) before
        anything is written. A folder with that name without our marker is refused (`conflict`, `reason: not_ours`) and
        left as it is; an update rewrites only our files. The browser still needs two gestures from the person (Developer
        mode, then drag the folder or "Load unpacked"). Errors are generic; details go to the log.
      x-module: plugin/api/extension.py
      x-unit: area-extension
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExtensionSetupRequest'}
            example: {browser: chrome}
      x-data: {$ref: '#/components/schemas/ExtensionSetupResult'}
      x-errors: [conflict, invalid]
      responses:
        '200':
          description: Envelope; `data` follows x-data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyEnvelope'}
              example: {ok: true, data: {state: installed, action: installed, path: '/home-folder/HermesTube Extension', version: 0.1.0, opened: {extensions_page: true, folder: true}, open_problem: null, platform: macos, browser: {key: chrome, name: Google Chrome, extensions_url: 'chrome://extensions/', sandbox: null, app_id: null, folder_visible: true}}}

