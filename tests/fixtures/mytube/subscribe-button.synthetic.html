<!doctype html>
<!-- SINTÉTICO — estrutura DOM que o MyTube v0.9.0 procura para ler o estado de inscrição e cancelar.
     Ver tests/fixtures/README.md. A página real com botão "Inscrito"/"Subscribed" exige login e NÃO foi
     baixada; sem login o YouTube serve um buttonRenderer "Subscribe" que abre o modal "Sign in to subscribe"
     (ver youtube/channel/handle.Fireship.html).

     Seletores reproduzidos (ref/mytube/src):
       content/unsubscribe.ts:103-106  container  'ytd-subscribe-button-renderer, yt-subscribe-button-view-model'
       content/unsubscribe.ts:112      botão      container.querySelector('button')
       content/unsubscribe.ts:118-122  inscrito?  button[subscribed] | aria-label contém "unsubscribe"/"inscrit"
                                                  | container[subscribed] | container [subscribed]
       content/unsubscribe.ts:131-134  diálogo    'tp-yt-paper-dialog:not([aria-hidden="true"]), yt-confirm-dialog-renderer,
                                                   ytd-popup-container tp-yt-paper-dialog'
       content/unsubscribe.ts:137-139  confirmar  '#confirm-button button, #confirm-button yt-button-renderer button,
                                                   [slot="primaryAction"] button'
       content/unsubscribe.ts:149-163  menu       'tp-yt-paper-item, ytd-menu-service-item-renderer,
                                                   tp-yt-paper-listbox tp-yt-paper-item' com texto "unsubscribe" /
                                                   "cancelar inscri" / "desinscrever"
       content/unsubscribe.ts:165-168  confirmar  'tp-yt-paper-dialog:not([aria-hidden="true"]) #confirm-button button'
       shared/selectors.ts:9           channelSubscribeButton '#subscribe-button, ytd-subscribe-button-renderer'
       content/injector.ts:588-593     âncora     closest('#inner-header-container' | '#channel-header-container' |
                                                   '.page-header-view-model-wiz__page-header-headline')

     Uso: cada estado fica numa <section data-fixture-state="…">. O MyTube consulta `document`; o teste
     deve escopar a consulta à seção (section.querySelector(...)) ou copiar a seção para um documento novo.
       not-subscribed           layout clássico, não inscrito → executor deve pular (unsubscribe.ts:124-127)
       subscribed-classic       ytd-subscribe-button-renderer[subscribed] + button[subscribed]
       subscribed-view-model    layout novo (yt-subscribe-button-view-model, aria-label "Unsubscribe from …")
       subscribed-pt-br         layout novo em PT-BR (aria-label com "inscrit")
       menu-open                menu "Subscribed ▾" aberto (caminho via menu, unsubscribe.ts:149-163)
       confirm-dialog           diálogo de confirmação aberto (popup container)
       confirm-dialog-hidden    diálogo presente mas aria-hidden="true" (estado antes do clique)
-->

              <span>Unsubscribe</span></button></yt-button-shape></yt-button-renderer>

        </div>
      </yt-confirm-dialog-renderer>

<section data-fixture-state="confirm-dialog-hidden">
  <ytd-popup-container>
    <tp-yt-paper-dialog role="dialog" aria-hidden="true" style="display: none;">
      <yt-confirm-dialog-renderer>
        <div id="main">
          <yt-formatted-string id="text">Unsubscribe from Fireship?</yt-formatted-string>
          <div id="buttons">
            <yt-button-renderer id="cancel-button"><yt-button-shape><button aria-label="Cancel">

            <yt-button-renderer id="confirm-button"><yt-button-shape><button aria-label="Unsubscribe">

</ytd-browse></ytd-page-manager></ytd-app>
